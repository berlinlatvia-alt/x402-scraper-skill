name: AGI 24/7 Daemon
on:
  schedule:
    - cron: "*/15 * * * *" # Runs every 15 minutes, will skip if concurrency holds
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: agi-daemon
  cancel-in-progress: false # Do not cancel the running one, let the new one queue or skip

jobs:
  run-daemon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AGI Daemon
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # Run the daemon for up to 5.5 hours to avoid GitHub's 6-hour hard kill limit
          timeout 19800 python agi_247_goal_daemon.py || exit 0
